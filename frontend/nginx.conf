server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 500M;

    location /static/ {
        proxy_pass http://blaashal-configurator-backend:8000;
    }

    location /api/ {
        proxy_pass http://blaashal-configurator-backend:8000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}